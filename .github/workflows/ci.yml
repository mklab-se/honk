name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: No em-dashes
        run: |
          if git grep -nIP '\x{2014}'; then
            echo "::error::Em-dash (U+2014) found. Use a comma, colon, parentheses or a new sentence; in Rust code that needs the character, write \\u{2014}."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # aws-lc-sys (reqwest's TLS crypto provider) needs NASM to assemble its
      # optimized routines on Windows; CMake and MSVC are already on the image.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo test --workspace
      # Runners have no sound card: the real no-device path must be one warning
      # line and exit 0, never a failure or a wall of audio-library noise.
      - name: Headless honk
        shell: bash
        env:
          HONK_NO_UPDATE_CHECK: "1"
        run: |
          set +e
          cargo run -q -p honk -- --times 1 2> stderr.txt
          code=$?
          echo "exit code: $code"; echo "stderr:"; cat stderr.txt
          test "$code" -eq 0 || exit 1
          test "$(grep -c . stderr.txt)" -le 1 || { echo "::error::expected at most one stderr line"; exit 1; }

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
