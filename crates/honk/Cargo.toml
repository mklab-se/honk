[package]
name = "honk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Make your computer honk like an old-school car. Honk, honk!"
readme = "../../README.md"
keywords = ["cli", "honk", "sound", "notification", "fun"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "honk"
path = "src/main.rs"

[dependencies]
honk-core.workspace = true
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
colored.workspace = true
ctrlc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
semver.workspace = true
chrono.workspace = true
dirs.workspace = true
rodio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
hound.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/honk-v{ version }-{ target }.{ archive-format }"
bin-dir = "honk{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
