[workspace]
resolver = "2"
members = [
    "crates/honk",
    "crates/honk-core",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/honk"
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
honk-core = { version = "0.2.1", path = "crates/honk-core" }

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# serde_norway: maintained drop-in fork of the deprecated serde_yaml, chosen fleet-wide 2026-10-07.
serde_norway = "0.9"

# Async
tokio = { version = "1.53", features = ["full"] }

# HTTP
# rustls-tls-native-roots was renamed rustls in reqwest 0.13; it now validates against the
# live OS trust store (rustls-platform-verifier) with aws-lc-rs as the crypto provider, which
# needs NASM + CMake to build on Windows (see the release workflow's "Install NASM" step and
# INSTALL.md). Only the update checker uses it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Signals: lets `honk -- cmd` outlive Ctrl-C (Unix and the Windows console).
ctrlc = "3.5"

# Terminal
colored = "3.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Versioning & time
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Directories
dirs = "7.0"


# Audio
hound = "3.5"
# Playback on macOS and Windows only: no decoders, we synthesise everything.
# Linux plays through the system's player instead, so it needs no ALSA headers.
rodio = { version = "0.22", default-features = false, features = ["playback"] }

# Testing
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
